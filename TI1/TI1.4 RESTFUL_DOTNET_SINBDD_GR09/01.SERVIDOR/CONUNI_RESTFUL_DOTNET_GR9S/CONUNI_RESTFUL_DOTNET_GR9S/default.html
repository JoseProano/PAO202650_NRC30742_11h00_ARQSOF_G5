<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monsters Inc. RESTful API</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #111827 0%, #1f2937 48%, #0f766e 100%);
            color: #e5e7eb;
        }

        .card {
            width: min(720px, calc(100vw - 32px));
            background: rgba(17, 24, 39, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
        }

        p {
            margin: 0 0 16px;
            line-height: 1.5;
            color: #cbd5e1;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.18);
            color: #86efac;
            font-size: 0.95rem;
            margin-bottom: 18px;
        }

        .links {
            display: grid;
            gap: 12px;
            margin-top: 24px;
        }

        a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: fit-content;
            color: #f8fafc;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        a:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        code {
            color: #fcd34d;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="status">Servicio activo</div>
        <h1>Monsters Inc. RESTful API</h1>
        <p>
            Servidor REST funcional para conversiones y autenticación.
            Usa los clientes de consola, escritorio o web para consumirlo.
        </p>
        <p>
            Base URL: <code id="baseUrl"></code>
        </p>
        <div class="links">
            <a href="/api/conversion">Ver información del servicio</a>
            <a href="/api/conversion/endpoints">Ver endpoints disponibles</a>
        </div>
    </main>

    <script>
        document.getElementById('baseUrl').textContent = window.location.origin + '/api/conversion';
    </script>
</body>
</html>
